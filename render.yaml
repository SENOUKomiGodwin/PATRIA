# Blueprint Render — PATRIA (stack tout-en-un + Neon)
#
# Un seul service web : l'image deploy/all-in-one/Dockerfile contient
# nginx (port 10000) + les 6 microservices Laravel (127.0.0.1:8001-8006)
# + le frontend Blade (127.0.0.1:8007). La base est externe : Neon.
#
# Déploiement : Render Dashboard → New → Blueprint → ce dépôt.
# Renseigner DB_PASSWORD (mot de passe du rôle Neon `patria_app`)
# et vérifier APP_URL / API_URL / CORS_ALLOWED_ORIGINS si le sous-domaine
# onrender.com généré diffère de https://patria.onrender.com.

services:
  - type: web
    name: patria
    runtime: docker
    dockerfilePath: ./deploy/all-in-one/Dockerfile
    dockerContext: .
    region: frankfurt # même région que Neon (aws-eu-central-1)
    plan: 0.5c-512mb # 7 $/mois — passer à 1c-2g si OOM (voir docs/deploiement.md)
    healthCheckPath: /login
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_URL
        value: https://patria.onrender.com
      - key: CORS_ALLOWED_ORIGINS
        value: https://patria.onrender.com
      - key: APP_KEY
        generateValue: true
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_TTL
        value: "480"
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_HOST
        value: ep-autumn-mode-b98ogbj7.c-7.eu-central-1.aws.neon.tech
      - key: DB_PORT
        value: "5432"
      - key: DB_USERNAME
        value: patria_app
      - key: DB_PASSWORD
        sync: false # à renseigner dans le dashboard Render (secret Neon)
      - key: RUN_SEEDERS
        value: "true" # passer à "false" après le premier démarrage réussi
      - key: DEMO_MODE
        value: "false"
