# Blueprint Render — PATRIA (stack tout-en-un + Neon)
#
# Un seul service web : l'image deploy/all-in-one/Dockerfile contient
# nginx (port 10000) + les 6 microservices Laravel (127.0.0.1:8001-8006)
# + le frontend Blade (127.0.0.1:8007). La base est externe : Neon.
#
# Déploiement : Render Dashboard → New → Blueprint → ce dépôt.
# Renseigner DB_PASSWORD (mot de passe du rôle Neon `patria_app`)
# et vérifier APP_URL / API_URL / CORS_ALLOWED_ORIGINS si le sous-domaine
# onrender.com généré diffère de https://patria.onrender.com.

services:
  - type: web
    name: patria
    runtime: docker
    # Dockerfile copie a la racine pour Render (ne supporte pas les chemins relatifs dockerfilePath)
    dockerContext: .
    region: frankfurt # même région que Neon (aws-eu-central-1)
    plan: free # endort le service après inactivité (cold start ~1 min) ;
    # si OOM (7 process PHP + nginx dans 512 Mo) passer a 0.5c-512mb (~7 $/mois)
    healthCheckPath: /login
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_URL
        value: https://patria.onrender.com
      - key: CORS_ALLOWED_ORIGINS
        value: https://patria.onrender.com
      # APP_KEY doit être au format Laravel "base64:<32 octets>" — Render
      # generateValue produit une chaîne invalide pour l'Encrypter.
      # Générer avec : php artisan key:generate --show
      - key: APP_KEY
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_TTL
        value: "480"
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_HOST
        value: ep-autumn-mode-b98ogbj7.c-7.eu-central-1.aws.neon.tech
      - key: DB_PORT
        value: "5432"
      - key: DB_USERNAME
        value: patria_app
      - key: DB_PASSWORD
        sync: false # à renseigner dans le dashboard Render (secret Neon)
      - key: RUN_SEEDERS
        value: "false" # passer à "false" après le premier démarrage réussi
      - key: DEMO_MODE
        value: "false"
