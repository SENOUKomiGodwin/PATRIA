user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # DNS resolver pour Docker (résolution dynamique des noms de services)
    resolver 127.0.0.11 valid=30s;

    server {
        listen 80;
        server_name _;

        # Auth Service - /api/auth/* -> /api/* (strip du préfixe /auth/)
        # NB : proxy_pass avec variable => résolution DNS via le resolver Docker
        # à chaque requête (les IPs des conteneurs changent au redémarrage).
        location /api/auth/ {
            set $auth_upstream http://auth-service:8000;
            rewrite ^/api/auth/(.*)$ /api/$1 break;
            proxy_pass $auth_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Authorization $http_authorization;
        }

        # Asset Service - /api/assets (conserve le chemin complet)
        location /api/assets {
            set $asset_upstream http://asset-service:8000;
            proxy_pass $asset_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Authorization $http_authorization;
        }

        # Asset Service - /api/categories (conserve le chemin complet)
        location /api/categories {
            set $asset_upstream http://asset-service:8000;
            proxy_pass $asset_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Authorization $http_authorization;
        }

        # Asset Service - /api/locations (conserve le chemin complet)
        location /api/locations {
            set $asset_upstream http://asset-service:8000;
            proxy_pass $asset_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Authorization $http_authorization;
        }

        # Movement Service - /api/movements (conserve le chemin complet)
        location /api/movements {
            set $movement_upstream http://movement-service:8000;
            proxy_pass $movement_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Authorization $http_authorization;
        }

        # Inventory Service - /api/campaigns (conserve le chemin complet)
        location /api/campaigns {
            set $inventory_upstream http://inventory-service:8000;
            proxy_pass $inventory_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Authorization $http_authorization;
        }

        # Maintenance Service - /api/interventions (conserve le chemin complet)
        location /api/interventions {
            set $maintenance_upstream http://maintenance-service:8000;
            proxy_pass $maintenance_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Authorization $http_authorization;
        }

        # Maintenance Service - /api/maintenance-plans (conserve le chemin complet)
        location /api/maintenance-plans {
            set $maintenance_upstream http://maintenance-service:8000;
            proxy_pass $maintenance_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Authorization $http_authorization;
        }

        # Reporting Service - /api/reports (conserve le chemin complet)
        location /api/reports {
            set $reporting_upstream http://reporting-service:8000;
            proxy_pass $reporting_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Authorization $http_authorization;
        }

        # Frontend - route par défaut
        location / {
            set $frontend_upstream http://frontend:80;
            proxy_pass $frontend_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
